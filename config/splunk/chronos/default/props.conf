# Events arrive as one JSON object per HEC event (Vector splunk_hec_logs, codec json).
# HEC sets the event time from the `timestamp` field, so no time parsing is needed here;
# search-time JSON extraction exposes nested keys as geo.country_name and arrays as
# command_techniques{}.
[chronos:event]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000
