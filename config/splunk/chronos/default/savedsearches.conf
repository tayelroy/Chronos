# Chronos detections. Splunk Free cannot schedule searches or fire alert actions, so these are
# saved reports: run them from the Chronos app, the CLI (splunk search '| savedsearch "<name>"'),
# or the chronos_detections dashboard. Each maps to a MITRE ATT&CK technique and mirrors a rule
# already in config/vector/vector-core.yaml so the two engines can be compared.

[Chronos - SSH brute force (T1110.001)]
description = Source IPs with >= 10 failed Cowrie logins in any 10-minute window.
search = index=chronos sourcetype=chronos:event eventid=cowrie.login.failed \
| bin _time span=10m \
| stats count as failures dc(password) as distinct_passwords values(username) as usernames by _time src_ip geo.country_name \
| where failures >= 10 \
| sort - failures
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
request.ui_dispatch_app = chronos
request.ui_dispatch_view = chronos_detections

[Chronos - Successful login after brute force (T1078.001)]
description = IPs that logged in successfully after >= 5 failures: a guessed or sprayed credential that worked.
search = index=chronos sourcetype=chronos:event (eventid=cowrie.login.failed OR eventid=cowrie.login.success) \
| stats count(eval(eventid="cowrie.login.failed")) as failures count(eval(eventid="cowrie.login.success")) as successes values(eval(if(eventid="cowrie.login.success",username.":".password,null()))) as accepted_creds min(_time) as first_seen max(_time) as last_seen by src_ip geo.country_name \
| where successes > 0 AND failures >= 5 \
| eval first_seen=strftime(first_seen,"%F %T"), last_seen=strftime(last_seen,"%F %T") \
| sort - failures
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
request.ui_dispatch_app = chronos
request.ui_dispatch_view = chronos_detections

[Chronos - Download then execute in one session (T1105 -> T1222.002)]
description = Sessions that both staged a tool (T1105) and made it executable (T1222.002): the usual loader pattern.
search = index=chronos sourcetype=chronos:event eventid=cowrie.command.input \
| stats values(command_techniques{}) as techniques list(input) as commands min(_time) as first_seen by session src_ip geo.country_name \
| eval tech=mvjoin(techniques," ") \
| where match(tech,"T1105") AND match(tech,"T1222.002") \
| eval first_seen=strftime(first_seen,"%F %T") \
| table first_seen session src_ip geo.country_name commands
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
request.ui_dispatch_app = chronos
request.ui_dispatch_view = chronos_detections

[Chronos - SSH key persistence by campaign (T1098.004)]
description = authorized_keys writes grouped by the key comment, which is often a campaign marker (e.g. mdrfckr).
search = index=chronos sourcetype=chronos:event eventid=cowrie.command.input authorized_keys \
| rex field=input "ssh-(?:rsa|ed25519|dss)\s+\S+\s+(?<key_comment>\S+)" \
| eval key_comment=coalesce(key_comment,"(no comment)") \
| stats count dc(src_ip) as unique_ips values(src_ip) as src_ips min(_time) as first_seen max(_time) as last_seen by key_comment \
| eval first_seen=strftime(first_seen,"%F %T"), last_seen=strftime(last_seen,"%F %T") \
| sort - count
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
request.ui_dispatch_app = chronos
request.ui_dispatch_view = chronos_detections

[Chronos - Honeytoken key used (T1078.004)]
description = Honeytoken AWS keys used against the AWS API. UNEXPECTED SUCCESS means a call other than GetCallerIdentity was allowed; the deny-all policy would have failed.
search = index=chronos sourcetype=chronos:event honeypot=honeytoken \
| eval unexpected=if(aws_event_name!="GetCallerIdentity" AND isnull(aws_error_code),1,0) \
| stats min(_time) as first_use max(_time) as last_use count as api_calls values(aws_region) as regions values(aws_event_name) as aws_calls max(unexpected) as unexpected_success by bait src_ip geo.country_name \
| eval first_use=strftime(first_use,"%F %T"), last_use=strftime(last_use,"%F %T"), unexpected_success=if(unexpected_success=1,"YES","no") \
| sort - unexpected_success - api_calls
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
request.ui_dispatch_app = chronos
request.ui_dispatch_view = chronos_detections
