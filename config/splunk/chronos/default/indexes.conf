# chronos index: Vector ships live sensor events here over HEC (sourcetype chronos:event).
# 60-day retention matches the OpenSearch ISM policy; the size cap protects the core's disk.
[chronos]
homePath = $SPLUNK_DB/chronos/db
coldPath = $SPLUNK_DB/chronos/colddb
thawedPath = $SPLUNK_DB/chronos/thaweddb
frozenTimePeriodInSecs = 5184000
maxTotalDataSizeMB = 2048
