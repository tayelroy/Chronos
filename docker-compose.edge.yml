# chronos-sensor (t4g.micro, 1 GB): internet-facing decoys + log shipper.
# Host sshd must listen on 22222 so Cowrie can own :22. Admin access is SSM only.
name: chronos-edge

services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: chronos-edge-cowrie
    restart: unless-stopped
    mem_limit: 300m
    environment:
      - COWRIE_TELNET_ENABLED=yes
      - COWRIE_HONEYPOT_HOSTNAME=svr04
    ports:
      - "22:2222"
      - "23:2223"
    volumes:
      # Host dirs must be owned by the cowrie uid (999); see scripts/sensor-setup.sh.
      - ./logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      - ./logs/cowrie-tty:/cowrie/cowrie-git/var/lib/cowrie/tty
      - ./logs/cowrie-downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads

  canary_http:
    build:
      context: ./honeypots/canary_http
    container_name: chronos-edge-canary
    restart: unless-stopped
    mem_limit: 100m
    ports:
      - "80:8080"
    volumes:
      - ./logs/canary:/app/logs

  vector-edge:
    image: timberio/vector:0.34.1-alpine
    container_name: chronos-edge-vector
    restart: unless-stopped
    mem_limit: 150m
    environment:
      - CHRONOS_CORE_ADDR=${CHRONOS_CORE_ADDR:?set CHRONOS_CORE_ADDR in .env (core private ip:9002)}
    volumes:
      - ./config/vector/vector-edge.yaml:/etc/vector/vector.yaml:ro
      - ./logs/cowrie:/var/log/cowrie:ro
      - ./logs/canary:/var/log/canary:ro
      # File-read checkpoints + disk buffer survive restarts and core downtime.
      - vector-edge-data:/var/lib/vector

volumes:
  vector-edge-data:
