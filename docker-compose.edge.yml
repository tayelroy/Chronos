# chronos-sensor (t4g.micro, 1 GB): internet-facing decoys + log shipper.
# Host sshd must listen on 22222 so Cowrie can own :22. Admin access is SSM only.
name: chronos-edge

# Shared hardening: the decoys face the internet and must assume an exploit in
# Cowrie/Twisted/Flask is possible. No capabilities, no privilege escalation,
# read-only root filesystem; only the mounted log/state paths are writable.
x-hardened: &hardened
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  pids_limit: 128

services:
  cowrie:
    <<: *hardened
    # Pinned: start-cowrie.py depends on this image's fs.pickle layout and twistd path.
    # Cowrie 3.0.15 (cowrie/cowrie:latest as of 2026-09-19); bump deliberately and re-test the breadcrumbs.
    image: cowrie/cowrie@sha256:fc57120d88c2bfb5817f63f6c132ce5c2969b641c2f1ac67887652b6f294148d
    container_name: chronos-edge-cowrie
    mem_limit: 300m
    environment:
      - COWRIE_TELNET_ENABLED=yes
      - COWRIE_HONEYPOT_HOSTNAME=svr04
      # wget/curl/ftpget/tftp/nc really fetch so payloads can be captured; cap each transfer at 10 MB
      # so a bot cannot fill the sensor disk.
      - COWRIE_HONEYPOT_DOWNLOAD_LIMIT_SIZE=10485760
      # honeypots/cowrie/start-cowrie.py writes the breadcrumbed fake filesystem here, then execs twistd.
      - COWRIE_SHELL_FILESYSTEM=/tmp/fs.pickle
      - HONEYTOKEN_COWRIE_AWS_KEY_ID=${HONEYTOKEN_COWRIE_AWS_KEY_ID:-}
      - HONEYTOKEN_COWRIE_AWS_SECRET=${HONEYTOKEN_COWRIE_AWS_SECRET:-}
    # The image's entrypoint is python3; this is the image's own CMD behind the breadcrumb wrapper.
    command: ["/chronos/start-cowrie.py", "/cowrie/cowrie-env/bin/twistd", "-n", "--umask=0022", "--pidfile=",
              "--logger", "cowrie.python.logfile.stdoutLogger", "cowrie"]
    ports:
      - "22:2222"
      - "23:2223"
    tmpfs:
      - /tmp
      - /cowrie/cowrie-git/var/run
    volumes:
      - ./honeypots/cowrie:/chronos:ro
      # Host dirs must be owned by the cowrie uid (999); scripts/deploy.sh sets this.
      - ./logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      # SSH host keys and other state survive container re-creation (stable fingerprint).
      - cowrie-state:/cowrie/cowrie-git/var/lib/cowrie
      - ./logs/cowrie-tty:/cowrie/cowrie-git/var/lib/cowrie/tty
      - ./logs/cowrie-downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads

  canary_http:
    <<: *hardened
    build:
      context: ./honeypots/canary_http
    container_name: chronos-edge-canary
    mem_limit: 100m
    # Honeytoken AWS key pairs, one per bait file (honeypots/canary_http/app.py); unset = bait off.
    environment:
      - HONEYTOKEN_DOTENV_AWS_KEY_ID=${HONEYTOKEN_DOTENV_AWS_KEY_ID:-}
      - HONEYTOKEN_DOTENV_AWS_SECRET=${HONEYTOKEN_DOTENV_AWS_SECRET:-}
      - HONEYTOKEN_WPCONFIG_AWS_KEY_ID=${HONEYTOKEN_WPCONFIG_AWS_KEY_ID:-}
      - HONEYTOKEN_WPCONFIG_AWS_SECRET=${HONEYTOKEN_WPCONFIG_AWS_SECRET:-}
      - HONEYTOKEN_GIT_AWS_KEY_ID=${HONEYTOKEN_GIT_AWS_KEY_ID:-}
      - HONEYTOKEN_GIT_AWS_SECRET=${HONEYTOKEN_GIT_AWS_SECRET:-}
    tmpfs:
      - /tmp
    ports:
      - "80:8080"
    volumes:
      - ./logs/canary:/app/logs

  vector-edge:
    <<: *hardened
    image: timberio/vector:0.34.1-alpine
    container_name: chronos-edge-vector
    mem_limit: 150m
    environment:
      - CHRONOS_CORE_ADDR=${CHRONOS_CORE_ADDR:?set CHRONOS_CORE_ADDR in .env (core private ip:9002)}
    # Directory mount so git-updated configs are visible; scripts/deploy.sh restarts this service.
    command: ["--config", "/etc/vector/vector-edge.yaml"]
    volumes:
      - ./config/vector:/etc/vector:ro
      - ./logs/cowrie:/var/log/cowrie:ro
      - ./logs/canary:/var/log/canary:ro
      # File-read checkpoints + disk buffer survive restarts and core downtime.
      - vector-edge-data:/var/lib/vector

volumes:
  vector-edge-data:
  cowrie-state:
